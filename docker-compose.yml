
services:
  nginx:
    image: nginx:alpine
    volumes:
      - blog_content:/usr/share/nginx/html
    ports:
      - "${BLOG_PORT}:80"
    restart: unless-stopped

  blog_writer:
    build: .
    volumes:
      - blog_content:/blog_output/${BLOG_NAME}
    environment:
      - BLOG_NAME=${BLOG_NAME}
    restart: unless-stopped

  your_app:
    build: .
    # ...
    environment:
      - DATABASE_URL=${DB_URI}  # Pass the DB URI from .env to the container
    restart: unless-stopped