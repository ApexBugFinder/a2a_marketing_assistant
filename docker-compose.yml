services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./blog:/usr/share/nginx/html    # your static blog content
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

  your_app:
    build: .
    # ...
    environment:
      - DATABASE_URL=${DB_URI}  # Pass the DB URI from .env to the container
    restart: unless-stopped